<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
    }
    
    body{
    background:#0f0f0f;
    color:#fff;
    overflow-x:hidden;
    }
    
    
    /* Header */
    
    header{
    padding:25px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #333;
    animation:slideDown .8s ease;
    }
    
    .logo{
    font-size:32px;
    font-weight:bold;
    color:#D4AF37;
    letter-spacing:2px;
    }
    
    .back{
    text-decoration:none;
    color:white;
    transition:.3s;
    }
    
    .back:hover{
    color:#D4AF37;
    }
    
    
    /* Container */
    
    .container{
    width:90%;
    max-width:1200px;
    margin:50px auto;
    }
    
    
    .container h1{
    font-size:42px;
    margin-bottom:35px;
    animation:fadeUp 1s ease;
    }
    
    
    /* Cart Items */
    
    #cart-items{
    display:flex;
    flex-direction:column;
    gap:20px;
    }
    
    
    .cart-item{
    
    background:#1a1a1a;
    border-radius:20px;
    padding:20px;
    
    display:flex;
    align-items:center;
    justify-content:space-between;
    
    animation:fadeUp .6s ease forwards;
    
    transition:.4s;
    
    border:1px solid transparent;
    
    }
    
    
    .cart-item:hover{
    
    transform:translateY(-8px);
    border-color:#D4AF37;
    
    box-shadow:0 15px 35px rgba(212,175,55,.15);
    
    }
    
    
    
    .left{
    
    display:flex;
    align-items:center;
    gap:20px;
    
    }
    
    
    .left img{
    
    width:110px;
    height:110px;
    object-fit:cover;
    border-radius:15px;
    
    }
    
    
    .info h3{
    
    font-size:22px;
    
    }
    
    
    .price{
    
    color:#D4AF37;
    font-size:20px;
    margin-top:8px;
    
    }
    
    
    /* Quantity */
    
    .qty{
    
    display:flex;
    align-items:center;
    gap:12px;
    
    }
    
    
    .qty button{
    
    width:40px;
    height:40px;
    
    border:none;
    border-radius:50%;
    
    background:#D4AF37;
    
    cursor:pointer;
    
    font-size:22px;
    transition:.3s;
    
    }
    
    
    .qty button:hover{
    
    transform:scale(1.15);
    
    }
    
    
    /* Remove */
    
    .remove{
    
    background:#c0392b;
    color:white;
    
    border:none;
    
    padding:12px 18px;
    
    border-radius:12px;
    
    cursor:pointer;
    
    transition:.3s;
    
    }
    
    
    .remove:hover{
    
    transform:scale(1.1);
    
    }
    
    
    
    /* Summary */
    
    
    .summary{
    
    margin-top:40px;
    
    background:#1a1a1a;
    
    padding:30px;
    
    border-radius:20px;
    
    animation:fadeUp 1s ease;
    
    }
    
    
    .summary h2{
    
    display:flex;
    justify-content:space-between;
    
    color:#fff;
    
    }
    
    
    .checkout{
    
    width:100%;
    
    margin-top:25px;
    
    padding:18px;
    
    border:none;
    
    border-radius:30px;
    
    background:#D4AF37;
    
    font-size:20px;
    
    font-weight:bold;
    
    cursor:pointer;
    
    transition:.4s;
    
    animation:pulse 2s infinite;
    
    }
    
    
    .checkout:hover{
    
    transform:scale(1.03);
    
    background:#f1c94b;
    
    }
    
    
    
    /* Empty */
    
    
    .empty{
    
    text-align:center;
    
    margin-top:80px;
    
    color:#999;
    
    animation:fadeUp 1s ease;
    
    }
    
    
    
    /* Animations */
    
    
    @keyframes fadeUp{
    
    from{
    
    opacity:0;
    transform:translateY(40px);
    
    }
    
    to{
    
    opacity:1;
    transform:translateY(0);
    
    }
    
    }
    
    
    @keyframes slideDown{
    
    from{
    
    opacity:0;
    transform:translateY(-50px);
    
    }
    
    to{
    
    opacity:1;
    transform:translateY(0);
    
    }
    
    }
    
    
    @keyframes pulse{
    
    0%,100%{
    
    box-shadow:0 0 0 0 rgba(212,175,55,.5);
    
    }
    
    50%{
    
    box-shadow:0 0 25px 8px rgba(212,175,55,.2);
    
    }
    
    }
</style>
<body>

<header>

<div class="logo">
Infinity
</div>

<a href="index.html" class="back">
<i class="fa-solid fa-arrow-left"></i>
 Continue Shopping
</a>

</header>

<div class="container">

<h1>Shopping Cart</h1>

<div id="cart-items"></div>

<div class="summary">

<h2>

<span>Total</span>

<span id="total">0 EGP</span>

</h2>
<button class="checkout" onclick="orderWhatsApp()">
    <i class="fa-brands fa-whatsapp"></i>
     Order Via WhatsApp
    </button>

</button>

</div>

</div>

<script>

    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    
    const cartItems = document.getElementById("cart-items");
    const total = document.getElementById("total");
    
    function loadCart(){
    
    cartItems.innerHTML="";
    
    let totalPrice=0;
    
    if(cart.length==0){
    
    cartItems.innerHTML=`<div class="empty">
    <h2>Your Cart Is Empty 🛒</h2>
    </div>`;
    
    total.innerHTML="0 EGP";
    
    return;
    
    }
    
    cart.forEach((item,index)=>{
    
    if(!item.quantity){
    item.quantity=1;
    }
    
    totalPrice+=item.price*item.quantity;
    
    cartItems.innerHTML+=`
    
    <div class="cart-item">
    
    <div class="left">
    
    <img src="${item.image}">
    
    <div class="info">
    
    <h3>${item.name}</h3>
    
    <p class="price">${item.price} EGP</p>
    
    </div>
    
    </div>
    
    <div class="right">
    
    <div class="qty">
    
    <button onclick="minus(${index})">-</button>
    
    <span>${item.quantity}</span>
    
    <button onclick="plus(${index})">+</button>
    
    </div>
    
    <button class="remove" onclick="removeProduct(${index})">
    
    <i class="fa-solid fa-trash"></i>
    
    </button>
    
    </div>
    
    </div>
    
    `;
    
    });
    
    total.innerHTML=totalPrice+" EGP";
    
    }
    
    function plus(index){
    
    cart[index].quantity++;
    
    localStorage.setItem("cart",JSON.stringify(cart));
    
    loadCart();
    
    }
    
    function minus(index){
    
    cart[index].quantity--;
    
    if(cart[index].quantity<=0){
    
    cart.splice(index,1);
    
    }
    
    localStorage.setItem("cart",JSON.stringify(cart));
    
    loadCart();
    
    }
    
    function removeProduct(index){
    
    cart.splice(index,1);
    
    localStorage.setItem("cart",JSON.stringify(cart));
    
    loadCart();
    
    }
    
    loadCart();
    function orderWhatsApp(){

if(cart.length===0){

alert("Your cart is empty");
return;

}


let message="Hello Infinity Perfume 🌸%0A%0A";

message+="My Order:%0A";


cart.forEach(item=>{

message+=
`• ${item.name} x ${item.quantity} = ${item.price*item.quantity} EGP%0A`;

});


let totalPrice=cart.reduce((sum,item)=>{

return sum+(item.price*item.quantity);

},0);


message+=`%0ATotal: ${totalPrice} EGP`;


window.open(
"https://wa.me/201559575677?text="+message,
"_blank"
);


}
    </script>
</body>
</html>
